<title>Sweillem Redesign Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a kiln-fired spec sheet. Stone-grey ground from the S mark, maroon from the wordmark,
   glaze-brown for the product itself, hexagon geometry from the logo drives every reveal. */
:root{
  --paper:#f2f2ef; --surface:#ffffff; --sunk:#e8e7e3;
  --ink:#1c1818; --muted:#5d5f62; --line:#d6d4cf;
  --maroon:#7a0404; --maroon-hi:#9c1010; --on-maroon:#ffffff;
  --slate:#7f8285; --glaze:#3b2119; --glaze-hi:#6b3a26; --clay:#c07a4a; --fire:#e4572e;
  --bore:#f7f1ea; --ok:#1d6b43; --warn:#a15c00; --err:#b3261e;
  --shadow:0 1px 2px rgb(28 24 24/.06),0 8px 24px -8px rgb(28 24 24/.18);
  --font-display:"Jost","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  /* motion tokens (see Motion spec screen) */
  --t-instant:120ms; --t-quick:200ms; --t-base:320ms; --t-slow:560ms; --t-story:900ms;
  --ease-glaze:cubic-bezier(.2,.8,.2,1);      /* standard out */
  --ease-kiln:cubic-bezier(.65,0,.35,1);      /* in-out for things that travel */
  --ease-set:cubic-bezier(.34,1.56,.64,1);    /* small overshoot for things that land */
  --logo-filter:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141011; --surface:#1d1718; --sunk:#261f1f;
  --ink:#f1ebe8; --muted:#aaa19d; --line:#382e2d;
  --maroon:#e0524a; --maroon-hi:#f07068; --on-maroon:#1a0706;
  --slate:#9a9da0; --glaze:#5a3325; --glaze-hi:#8a5238; --clay:#d08a58; --fire:#ff7a45;
  --bore:#0f0b0b; --ok:#5cc28c; --warn:#e5a24a; --err:#ff8a80;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 10px 30px -10px rgb(0 0 0/.7);
  --logo-filter:brightness(0) invert(.94);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141011; --surface:#1d1718; --sunk:#261f1f;
  --ink:#f1ebe8; --muted:#aaa19d; --line:#382e2d;
  --maroon:#e0524a; --maroon-hi:#f07068; --on-maroon:#1a0706;
  --slate:#9a9da0; --glaze:#5a3325; --glaze-hi:#8a5238; --clay:#d08a58; --fire:#ff7a45;
  --bore:#0f0b0b; --ok:#5cc28c; --warn:#e5a24a; --err:#ff8a80;
  --shadow:0 1px 2px rgb(0 0 0/.4),0 10px 30px -10px rgb(0 0 0/.7);
  --logo-filter:brightness(0) invert(.94);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sunk);color:var(--ink);font:15px/1.6 var(--font-body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--maroon);outline-offset:3px;border-radius:4px}

/* ---------- prototype chrome ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px;padding-inline:16px;background:var(--ink);color:var(--paper);font-size:13px;position:relative;z-index:5}
.bar b{font-family:var(--font-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.bar .grp{display:flex;align-items:center;gap:6px}
.bar label{opacity:.7;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.bar select{background:transparent;border:1px solid color-mix(in srgb,var(--paper) 35%,transparent);border-radius:6px;padding:4px 8px;color:var(--paper)}
.bar select option{color:var(--ink);background:var(--surface)}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--paper) 35%,transparent);border-radius:999px;padding:2px;position:relative}
.seg button{border:0;background:transparent;padding:3px 10px;border-radius:999px;cursor:pointer;font-size:12px;color:var(--paper);position:relative;z-index:1}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.bar .sp{flex:1}
#stage{display:grid;place-items:center;height:calc(100% - var(--barH,52px));padding:0;transition:padding var(--t-base) var(--ease-glaze)}
#stage.mobile{padding-block:14px;padding-inline:16px}
#site{container:site/inline-size;position:relative;overflow:hidden;background:var(--paper);width:100%;height:100%;transition:width var(--t-slow) var(--ease-kiln),border-radius var(--t-slow) var(--ease-kiln)}
#stage.mobile #site{width:min(390px,100%);height:min(812px,100%);border-radius:34px;border:9px solid var(--ink);box-shadow:var(--shadow)}
#view{overflow-x:clip}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
#site[data-motion="reduced"] #scroller{scroll-behavior:auto}
#site[data-motion="reduced"] *,#site[data-motion="reduced"] *::before,#site[data-motion="reduced"] *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}

/* ---------- site base ---------- */
#site{font-family:var(--font-body)}
#site[lang="ar"]{--font-body:"IBM Plex Sans Arabic",system-ui,sans-serif;--font-display:"IBM Plex Sans Arabic","Jost",system-ui,sans-serif}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4cqi,40px)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.08;margin:0;text-wrap:balance;font-weight:600}
#site[lang="ar"] :is(h1,h2,h3){line-height:1.35;font-weight:700}
h1{font-size:clamp(34px,5.4cqi,68px);letter-spacing:-.01em}
h2{font-size:clamp(26px,3.4cqi,42px)}
h3{font-size:19px}
p{margin:0;max-width:62ch}
.eyebrow{font-family:var(--font-data);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon);display:flex;gap:10px;align-items:center}
#site[lang="ar"] .eyebrow{font-family:var(--font-body);letter-spacing:0;font-weight:600}
.eyebrow::before{content:"";width:9px;height:10px;background:currentColor;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.lede{font-size:clamp(16px,1.6cqi,19px);color:var(--muted)}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
section{padding-block:clamp(56px,8cqi,104px)}
.sec-head{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:end;justify-content:space-between;margin-block-end:36px}
.sec-head>div{display:grid;gap:12px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;text-decoration:none;transition:background var(--t-quick),transform var(--t-quick) var(--ease-glaze),box-shadow var(--t-quick);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--maroon);color:var(--on-maroon)}
.btn-primary:hover{background:var(--maroon-hi);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--maroon) 70%,transparent)}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn-ghost:hover{border-color:var(--ink)}
.btn svg{width:18px;height:18px;flex:none;transition:transform var(--t-quick) var(--ease-glaze)}
.btn:hover svg.go{transform:translateX(4px)}
[dir="rtl"] .flip{transform:scaleX(-1)}
[dir="rtl"] .btn:hover svg.go{transform:scaleX(-1) translateX(4px)}
.link{color:var(--maroon);font-weight:600;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size var(--t-base) var(--ease-glaze)}
[dir="rtl"] .link{background-position:100% 100%}
.link:hover{background-size:100% 1.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--surface)}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.note::before{content:"i";flex:none;width:16px;height:16px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font:600 10px/1 var(--font-data);margin-block-start:2px}
.tag-draft{font:500 11px var(--font-data);color:var(--warn);border:1px dashed currentColor;border-radius:4px;padding:1px 6px}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:20;transition:background var(--t-base),box-shadow var(--t-base),padding var(--t-base) var(--ease-glaze);padding-block:18px}
.hdr.stuck{background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(12px) saturate(1.3);box-shadow:0 1px 0 var(--line);padding-block:10px}
.hdr .wrap{display:flex;align-items:center;gap:20px}
.logo{display:block;height:40px;transition:height var(--t-base) var(--ease-glaze);cursor:pointer;flex:none}
.hdr.stuck .logo{height:32px}
.logo img{height:100%;width:auto;filter:var(--logo-filter)}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{position:relative;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:14.5px;cursor:pointer}
.nav a::after{content:"";position:absolute;inset-inline:12px;bottom:3px;height:2px;background:var(--maroon);transform:scaleX(0);transform-origin:var(--o,left);transition:transform var(--t-base) var(--ease-glaze)}
[dir="rtl"] .nav a::after{--o:right}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.lang{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.qbtn{position:relative;display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px}
.qbtn svg{width:18px;height:18px}
.qcount{min-width:20px;height:20px;border-radius:10px;background:var(--maroon);color:var(--on-maroon);font:600 11px/20px var(--font-data);text-align:center;padding-inline:5px}
.qbtn.bump{animation:bump var(--t-slow) var(--ease-set)}
@keyframes bump{30%{transform:scale(1.14)}60%{transform:scale(.96)}}
.burger{display:none;border:0;background:transparent;width:42px;height:42px;cursor:pointer;position:relative}
.burger span{position:absolute;inset-inline:10px;height:2px;background:var(--ink);transition:transform var(--t-base) var(--ease-glaze),opacity var(--t-quick)}
.burger span:nth-child(1){top:14px}.burger span:nth-child(2){top:20px}.burger span:nth-child(3){top:26px}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
@container site (max-width:900px){
  .nav{display:none}.burger{display:block}.hdr-actions{margin-inline-start:auto}
  .qbtn .qlabel{display:none}
}
/* mobile menu: hex iris from the burger */
#mmenu{position:absolute;inset:0;z-index:15;background:var(--maroon);color:var(--on-maroon);padding:96px 24px 32px;display:flex;flex-direction:column;gap:6px;
  clip-path:circle(0 at var(--mx,90%) 40px);transition:clip-path var(--t-slow) var(--ease-kiln);pointer-events:none}
#mmenu.open{clip-path:circle(150% at var(--mx,90%) 40px);pointer-events:auto}
#mmenu a{font:600 30px/1.2 var(--font-display);color:inherit;text-decoration:none;cursor:pointer;opacity:0;transform:translateY(18px);transition:opacity var(--t-base),transform var(--t-slow) var(--ease-glaze);padding-block:6px;border-bottom:1px solid color-mix(in srgb,var(--on-maroon) 20%,transparent)}
#mmenu.open a{opacity:1;transform:none;transition-delay:calc(var(--i)*45ms + 160ms)}

/* ---------- reveal system ---------- */
.pre{opacity:0;transform:translateY(22px)}
.rv{transition:opacity var(--t-slow) var(--ease-glaze),transform var(--t-slow) var(--ease-glaze);transition-delay:calc(var(--d,0)*70ms)}
.view-enter{animation:viewIn var(--t-slow) var(--ease-glaze)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}}

/* ---------- home hero ---------- */
.hero{overflow-x:clip;padding-block:clamp(20px,4cqi,56px) clamp(48px,6cqi,80px)}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,4cqi,64px);align-items:center}
.hero-copy{display:grid;gap:22px;min-width:0}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-block-end:.08em}
.hero h1 .w>span{display:inline-block;animation:rise var(--t-story) var(--ease-glaze) both;animation-delay:calc(var(--i)*55ms + 120ms)}
.hero h1 em{font-style:normal;color:var(--maroon)}
@keyframes rise{from{transform:translateY(105%)}}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}
.fade-up{animation:fadeUp var(--t-slow) var(--ease-glaze) both;animation-delay:var(--dl,0ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
.hero-media{position:relative;aspect-ratio:1/1.02;max-width:100%;min-width:0}
.frame{position:absolute;inset:0;clip-path:polygon(0 0,82% 0,100% 18%,100% 100%,18% 100%,0 82%);background:var(--glaze);overflow:hidden}
[dir="rtl"] .frame{clip-path:polygon(18% 0,100% 0,100% 82%,82% 100%,0 100%,0 18%)}
.frame .slide{position:absolute;inset:0;background-size:cover;background-position:center;clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%,50% 50%,50% 50%);transition:clip-path 1.1s var(--ease-kiln)}
.frame .slide.on{clip-path:polygon(50% -70%,170% -10%,170% 110%,50% 170%,-70% 110%,-70% -10%)}
.frame .slide.base{clip-path:polygon(50% -70%,170% -10%,170% 110%,50% 170%,-70% 110%,-70% -10%);transition:none}
.frame .slide img{width:100%;height:100%;object-fit:cover;animation:kb 12s linear both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.rings{position:absolute;inset:-8%;pointer-events:none;z-index:-1}
.rings circle{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:var(--c);stroke-dashoffset:var(--c);animation:draw 2.4s var(--ease-kiln) forwards;animation-delay:calc(var(--i)*180ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.cap{position:absolute;inset-inline-start:-4%;bottom:10%;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:12px 16px;display:grid;gap:2px;min-width:200px;z-index:2}
.cap small{font:500 11px var(--font-data);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cap strong{font-family:var(--font-display);font-size:16px}
.cap .dots{display:flex;gap:6px;margin-block-start:6px}
.cap .dots button{width:22px;height:4px;border-radius:2px;border:0;background:var(--line);cursor:pointer;padding:0;position:relative;overflow:hidden}
.cap .dots button.on::after{content:"";position:absolute;inset:0;background:var(--maroon);transform-origin:left;animation:prog 5.5s linear forwards}
[dir="rtl"] .cap .dots button.on::after{transform-origin:right}
@keyframes prog{from{transform:scaleX(0)}}
.badge1935{position:absolute;inset-inline-end:-3%;top:6%;width:112px;height:128px;background:var(--maroon);color:var(--on-maroon);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-content:center;text-align:center;z-index:2;animation:spinIn 1.2s var(--ease-set) .5s both}
.badge1935 span{font:500 10px var(--font-data);letter-spacing:.14em;text-transform:uppercase}
.badge1935 b{font:700 30px/1 var(--font-display)}
@keyframes spinIn{from{transform:rotate(-60deg) scale(.4);opacity:0}}
@container site (max-width:760px){
  .hero .wrap{grid-template-columns:1fr}
  .hero-media{order:-1;aspect-ratio:4/3.3}
  .cap{min-width:0;inset-inline-start:12px;bottom:12px}
  .badge1935{width:84px;height:96px;inset-inline-end:8px}.badge1935 b{font-size:22px}
}

/* ---------- stats + marquee ---------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);border-block:1px solid var(--line)}
.stat{padding:26px 20px;display:grid;gap:4px;border-inline-start:1px solid var(--line);min-width:0}
.stat:first-child{border-inline-start:0}
.stat b{font:600 clamp(28px,3.4cqi,44px)/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat b small{font-size:.5em;color:var(--maroon);margin-inline-start:2px}
.stat span{font-size:13px;color:var(--muted)}
@container site (max-width:760px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(odd){border-inline-start:0}.stat{border-block-end:1px solid var(--line)}.stat:last-child{grid-column:1/-1}}
.marquee{overflow:hidden;border-block-end:1px solid var(--line);padding-block:14px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee .track{display:flex;gap:44px;width:max-content;animation:mq 38s linear infinite}
.marquee:hover .track{animation-play-state:paused}
[dir="rtl"] .marquee .track{animation-direction:reverse}
.marquee span{font:500 13px var(--font-data);letter-spacing:.08em;color:var(--muted);display:flex;gap:44px;align-items:center;white-space:nowrap}
.marquee span::after{content:"";width:7px;height:8px;background:var(--maroon);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- product family grid ---------- */
.fam{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fam button{all:unset;box-sizing:border-box;background:var(--surface);padding:22px 18px;display:grid;gap:14px;cursor:pointer;position:relative;min-height:170px;align-content:space-between;transition:background var(--t-base)}
.fam button:focus-visible{outline:2px solid var(--maroon);outline-offset:-4px}
.fam svg{width:56px;height:56px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:stroke var(--t-base),transform var(--t-slow) var(--ease-set)}
.fam svg .dr{stroke-dasharray:240;stroke-dashoffset:0;transition:stroke-dashoffset 0s}
.fam button:hover{background:var(--paper)}
.fam button:hover svg{stroke:var(--maroon);transform:translateY(-4px) rotate(-4deg)}
.fam button:hover svg .dr{animation:redraw .9s var(--ease-kiln)}
@keyframes redraw{from{stroke-dashoffset:240}}
.fam h3{font-size:16px}
.fam small{font:500 11px var(--font-data);color:var(--muted);letter-spacing:.06em}
.fam .arr{position:absolute;inset-inline-end:16px;top:18px;width:18px;opacity:0;transform:translate(-6px,6px);transition:all var(--t-base) var(--ease-glaze);stroke:var(--maroon)}
.fam button:hover .arr{opacity:1;transform:none}
@container site (max-width:900px){.fam{grid-template-columns:repeat(2,1fr)}.fam button{min-height:140px}}

/* ---------- film slot ---------- */
.film{position:relative;aspect-ratio:16/8;max-width:100%;border-radius:22px;overflow:hidden;background:var(--glaze);isolation:isolate;cursor:pointer;border:0;padding:0;width:100%;display:block;text-align:start;color:#fff}
.film img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transition:transform 1.2s var(--ease-glaze),opacity var(--t-base)}
.film:hover img{transform:scale(1.04);opacity:.45}
.film .inner{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;padding:clamp(18px,3cqi,36px);background:linear-gradient(to top,rgb(20 8 6/.85),transparent 60%)}
.film .play{justify-self:center;align-self:center;width:84px;height:96px;background:#fff;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;transition:transform var(--t-base) var(--ease-set)}
.film:hover .play{transform:scale(1.1) rotate(30deg)}
.film .play svg{width:28px;fill:#7a0404;transition:transform var(--t-base) var(--ease-set)}
.film:hover .play svg{transform:rotate(-30deg)}
.film h3{font-size:clamp(20px,2.6cqi,32px);color:#fff}
.film .inner>span:last-child{display:grid;gap:8px}
.film p{color:rgb(255 255 255/.8);font-size:14px}
.film .steps{display:flex;gap:6px;margin-block-start:14px;flex-wrap:wrap}
.film .steps span{font:500 11px var(--font-data);letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:rgb(255 255 255/.14);color:#fff;backdrop-filter:blur(4px)}
.film .pending{position:absolute;top:18px;inset-inline-end:18px;font:500 11px var(--font-data);letter-spacing:.08em;background:#fff;color:#7a0404;padding:5px 10px;border-radius:999px;text-transform:uppercase}

/* ---------- project cards ---------- */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:12px;min-width:0}
.pcard .ph{aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;position:relative;background:var(--sunk)}
.pcard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease-glaze)}
.pcard:hover .ph img{transform:scale(1.06)}
.pcard .ph::after{content:attr(data-region);position:absolute;top:12px;inset-inline-start:12px;font:500 11px var(--font-data);letter-spacing:.08em;text-transform:uppercase;background:var(--surface);color:var(--ink);padding:4px 9px;border-radius:999px}
.pcard h3{font-size:18px}
.pcard p{font-size:13.5px;color:var(--muted)}
.pcard:focus-visible .ph{outline:2px solid var(--maroon);outline-offset:3px}
@container site (max-width:760px){.pgrid{grid-template-columns:1fr}}

/* ---------- euro band ---------- */
.euro{position:relative;overflow:hidden;border-radius:26px;background:var(--glaze);color:#fff;display:grid;grid-template-columns:1fr 1fr;min-height:360px}
.euro .txt{padding:clamp(24px,4cqi,56px);display:grid;gap:16px;align-content:center;position:relative;z-index:1}
.euro .txt img{height:44px;width:auto;justify-self:start;filter:brightness(0) invert(1)}
.euro .txt p{color:rgb(255 255 255/.8)}
.euro .pic{position:relative;overflow:hidden}
.euro .pic img{position:absolute;inset:-12% 0;width:100%;height:124%;object-fit:cover;will-change:transform}
@container site (max-width:760px){.euro{grid-template-columns:1fr}.euro .pic{min-height:220px}}

/* ---------- footer ---------- */
.foot{border-block-start:1px solid var(--line);padding-block:48px 28px;margin-block-start:40px;font-size:14px}
.foot .wrap{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:28px}
.foot h4{font:500 11px var(--font-data);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-block-end:10px}
.foot a{display:block;color:var(--ink);text-decoration:none;padding-block:3px;cursor:pointer}
.foot a:hover{color:var(--maroon)}
.foot .logo{height:36px;margin-block-end:14px}
.foot .base{grid-column:1/-1;border-block-start:1px solid var(--line);padding-block-start:18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;color:var(--muted);font-size:12.5px}
@container site (max-width:760px){.foot .wrap{grid-template-columns:1fr 1fr}.foot .wrap>div:first-child{grid-column:1/-1}}

/* ---------- explorer ---------- */
.page-head{padding-block:clamp(24px,4cqi,56px) 8px;display:grid;gap:14px}
.xp{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(20px,3cqi,40px);align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,2.4cqi,28px);display:grid;gap:22px;min-width:0}
.ctl{display:grid;gap:10px}
.ctl>label,.ctl>.lbl{font:500 11px var(--font-data);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#site[lang="ar"] .ctl>label,#site[lang="ar"] .ctl>.lbl{font-family:var(--font-body);letter-spacing:0;font-size:12.5px;font-weight:600}
.pill{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;position:relative}
.pill button{border:0;background:transparent;padding:10px 8px;border-radius:9px;cursor:pointer;font-weight:600;position:relative;z-index:1;transition:color var(--t-base);display:grid;gap:0;line-height:1.25}
.pill button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.pill .ind{position:absolute;top:4px;bottom:4px;border-radius:9px;background:var(--surface);box-shadow:var(--shadow);transition:inset-inline-start var(--t-slow) var(--ease-set),width var(--t-slow) var(--ease-set)}
.dns{display:flex;flex-wrap:wrap;gap:6px}
.dns button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px;cursor:pointer;font:500 13px var(--font-data);transition:all var(--t-quick) var(--ease-glaze);min-width:52px}
.dns button:hover{border-color:var(--ink);transform:translateY(-2px)}
.dns button[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:var(--on-maroon)}
.dns button sup{font-size:9px;opacity:.75;margin-inline-start:2px}
.range{width:100%;accent-color:var(--maroon)}
.fams{display:flex;flex-wrap:wrap;gap:6px}
.fams button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.fams button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;user-select:none}
.toggle input{appearance:none;width:40px;height:23px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;transition:background var(--t-base);flex:none;margin:0}
.toggle input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:50%;background:var(--surface);transition:inset-inline-start var(--t-base) var(--ease-set);box-shadow:0 1px 3px rgb(0 0 0/.3)}
.toggle input:checked{background:var(--maroon)}
.toggle input:checked::after{inset-inline-start:20px}
.viz{position:relative;background:radial-gradient(circle at 50% 45%,var(--surface),var(--sunk));border:1px solid var(--line);border-radius:20px;overflow:hidden;min-width:0}
.viz svg.xs{display:block;width:100%;height:auto;max-height:520px}
.viz .readout{position:absolute;top:16px;inset-inline-start:18px;display:grid;gap:2px}
.viz .readout b{font:600 34px/1 var(--font-display)}
.viz .readout span{font:500 11px var(--font-data);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.viz .legend{position:absolute;bottom:14px;inset-inline:18px;display:flex;flex-wrap:wrap;gap:6px 14px;font:500 11.5px var(--font-data);color:var(--muted)}
.viz .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.spec div{background:var(--surface);padding:12px 14px;display:grid;gap:2px;min-width:0}
.spec dt{font-size:11.5px;color:var(--muted)}
.spec dd{margin:0;font:500 16px var(--font-data);font-variant-numeric:tabular-nums}
.spec dd.flash{animation:flash .7s var(--ease-glaze)}
@keyframes flash{from{color:var(--maroon);transform:translateY(-3px)}}
.addrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.qty button{border:0;background:transparent;width:36px;height:40px;cursor:pointer;font-size:18px}
.qty input{width:44px;text-align:center;border:0;background:transparent;font:500 14px var(--font-data);height:40px}
@container site (max-width:900px){.xp{grid-template-columns:1fr}.viz{order:-1}.spec{grid-template-columns:1fr 1fr}.spec div:last-child{grid-column:1/-1}}
/* spec table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table.st{border-collapse:collapse;width:100%;font-size:13px;min-width:860px}
.st th{font:500 11px/1.3 var(--font-body);color:var(--muted);text-align:start;padding:12px 10px;border-block-end:1px solid var(--line);vertical-align:bottom;background:var(--paper);position:sticky;top:0}
.st td{padding:10px;border-block-end:1px solid var(--line);font-family:var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap;transition:background var(--t-base)}
.st tr{cursor:pointer}
.st tbody tr:hover td{background:var(--paper)}
.st tr.on td{background:color-mix(in srgb,var(--maroon) 11%,var(--surface))}
.st tr.on td:first-child{box-shadow:inset 3px 0 0 var(--maroon)}
[dir="rtl"] .st tr.on td:first-child{box-shadow:inset -3px 0 0 var(--maroon)}
.cards-st{display:none;gap:10px}
.cards-st button{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.cards-st button.on{border-color:var(--maroon);box-shadow:inset 0 0 0 1px var(--maroon)}
.cards-st b{font:600 22px/1 var(--font-display);grid-row:span 3}
.cards-st span{font-family:var(--font-data);color:var(--muted)}
@container site (max-width:640px){.tbl-wrap{display:none}.cards-st{display:grid}}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:36px 24px;display:grid;gap:12px;justify-items:center;text-align:center}
.empty svg{width:88px;height:88px}
.empty p{color:var(--muted)}

/* ---------- process scrollytelling ---------- */
.pj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4cqi,56px)}
.pj-stick{position:sticky;top:86px;align-self:start;display:grid;gap:14px}
.pj-vis{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:22px;overflow:hidden;background:var(--glaze)}
.pj-vis .slide{position:absolute;inset:0;clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%,50% 50%,50% 50%);transition:clip-path .9s var(--ease-kiln)}
.pj-vis .slide.on{clip-path:polygon(50% -70%,170% -10%,170% 110%,50% 170%,-70% 110%,-70% -10%);z-index:1}
.pj-vis .slide.was{clip-path:polygon(50% -70%,170% -10%,170% 110%,50% 170%,-70% 110%,-70% -10%);z-index:0}
.pj-vis img{width:100%;height:100%;object-fit:cover}
.pj-vis .num{position:absolute;z-index:3;top:14px;inset-inline-start:16px;font:700 64px/1 var(--font-display);color:#fff;text-shadow:0 2px 20px rgb(0 0 0/.4);font-variant-numeric:tabular-nums}
.dial{position:absolute;z-index:3;bottom:14px;inset-inline-end:14px;width:150px;background:rgb(20 10 8/.72);backdrop-filter:blur(6px);border-radius:16px;padding:10px;color:#fff;transition:opacity var(--t-base),transform var(--t-base) var(--ease-set)}
.dial.off{opacity:0;transform:translateY(10px) scale(.95)}
.dial svg{width:100%;height:auto;display:block}
.dial .v{font:600 22px var(--font-display);text-align:center;margin-block-start:-44px;font-variant-numeric:tabular-nums}
.dial .l{font:500 10px var(--font-data);letter-spacing:.08em;text-transform:uppercase;text-align:center;opacity:.75;margin-block-start:14px}
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rail i{height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.rail i::after{content:"";position:absolute;inset:0;background:var(--maroon);transform:scaleX(var(--f,0));transform-origin:left;transition:transform var(--t-base) linear}
[dir="rtl"] .rail i::after{transform-origin:right}
.pj-steps{display:grid}
.step{min-height:78cqh;display:grid;align-content:center;gap:14px;padding-block:24px;opacity:.35;transition:opacity var(--t-slow)}
.step.on{opacity:1}
.step .k{font:500 12px var(--font-data);letter-spacing:.14em;color:var(--maroon);text-transform:uppercase}
.step h3{font-size:clamp(26px,3cqi,38px)}
.step ul{margin:0;padding-inline-start:18px;color:var(--muted);display:grid;gap:4px}
.step .facts{display:flex;flex-wrap:wrap;gap:6px}
@container site (max-width:760px){
  .pj{grid-template-columns:1fr}
  .pj-stick{top:62px;z-index:2;background:var(--paper);padding-block:8px}
  .pj-vis{aspect-ratio:16/10}
  .pj-vis .num{font-size:40px}
  .dial{width:112px}
  .step{min-height:60cqh}
}

/* ---------- timeline ---------- */
.tl{position:relative;display:grid;gap:34px;padding-inline-start:44px}
.tl::before{content:"";position:absolute;inset-inline-start:13px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .fill{position:absolute;inset-inline-start:13px;top:6px;width:2px;background:var(--maroon);height:var(--h,0px);transition:height .2s linear}
.tl article{position:relative;display:grid;gap:6px;max-width:62ch}
.tl article::before{content:"";position:absolute;inset-inline-start:-40px;top:4px;width:22px;height:25px;background:var(--surface);border:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:inset 0 0 0 30px var(--line);transition:box-shadow var(--t-base)}
.tl article.lit::before{box-shadow:inset 0 0 0 30px var(--maroon);animation:pop var(--t-slow) var(--ease-set)}
@keyframes pop{50%{transform:scale(1.35)}}
.tl .yr{font:600 28px/1 var(--font-display);color:var(--maroon)}
.tl .yr.u{font:500 12px var(--font-data);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.certs{display:flex;flex-wrap:wrap;gap:8px}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.about-grid img{border-radius:20px;width:100%;aspect-ratio:4/3;object-fit:cover;max-width:100%}
@container site (max-width:760px){.about-grid{grid-template-columns:1fr}}

/* ---------- projects map ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;position:relative}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;transition:all var(--t-quick)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button .n{font:500 11px var(--font-data);opacity:.7;margin-inline-start:4px}
.mapwrap{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
.map{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto}
.map .grat{stroke:var(--line);stroke-width:.6;fill:none}
.map .sea{font:italic 400 9px var(--font-body);fill:var(--muted);letter-spacing:.1em}
.map .country{font:600 8.5px var(--font-data);fill:var(--slate);letter-spacing:.14em}
.pin{cursor:pointer;transition:opacity var(--t-base),transform var(--t-slow) var(--ease-set);transform-box:fill-box;transform-origin:50% 100%}
.pin.drop{animation:drop .8s var(--ease-set) both;animation-delay:calc(var(--i)*110ms + 200ms)}
@keyframes drop{from{transform:translateY(-40px) scale(.6);opacity:0}}
.pin.dim{opacity:.18;transform:scale(.7)}
.pin .pulse{fill:var(--maroon);opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s var(--ease-glaze) infinite}
.pin.site .pulse{fill:var(--slate)}
@keyframes pulse{from{transform:scale(.4);opacity:.5}to{transform:scale(2.4);opacity:0}}
.pin path{fill:var(--maroon);stroke:var(--surface);stroke-width:1.2}
.pin.site path{fill:var(--slate)}
.pin text{font:600 8.5px var(--font-body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.pin:hover path,.pin.hot path{fill:var(--maroon-hi)}
.map .key{position:absolute;bottom:10px;inset-inline-start:12px;display:flex;gap:12px;font:500 11px var(--font-data);color:var(--muted);flex-wrap:wrap}
.map .key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}
.plist{display:grid;gap:12px}
.plist .pcard{grid-template-columns:120px 1fr;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;transition:border-color var(--t-quick)}
.plist .pcard:hover,.plist .pcard.hot{border-color:var(--maroon)}
.plist .pcard .ph{aspect-ratio:1;border-radius:10px}
.plist .pcard .ph::after{display:none}
.plist .pcard.gone{display:none}
.plist .site-row{grid-template-columns:1fr;padding:14px 16px}
@container site (max-width:900px){.mapwrap{grid-template-columns:1fr}}
/* lightbox */
#lightbox{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgb(12 6 6/.0);pointer-events:none;transition:background var(--t-base)}
#lightbox.open{background:rgb(12 6 6/.86);pointer-events:auto}
#lightbox figure{margin:0;display:grid;gap:12px;max-width:min(900px,92%);color:#fff;opacity:0;transition:opacity var(--t-base)}
#lightbox.open figure{opacity:1}
#lightbox img{width:100%;max-height:68cqh;object-fit:contain;border-radius:12px}
#lightbox figcaption{display:grid;gap:4px}
#lightbox figcaption small{color:rgb(255 255 255/.7)}
#lightbox .x{position:absolute;top:16px;inset-inline-end:16px;width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255/.14);color:#fff;font-size:22px;cursor:pointer}
.ghost{position:absolute;z-index:41;border-radius:12px;object-fit:cover;pointer-events:none}

/* ---------- roof tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4cqi,56px);align-items:center}
.tstage{position:relative;aspect-ratio:1/1.05;max-width:100%;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--tint) 32%,var(--surface)),color-mix(in srgb,var(--tint) 12%,var(--paper)));transition:background var(--t-slow);display:grid;place-items:center}
.tstage img{position:absolute;height:84%;width:auto;max-width:90%;object-fit:contain;filter:drop-shadow(0 26px 30px rgb(0 0 0/.3));transition:clip-path .8s var(--ease-kiln),transform .8s var(--ease-glaze)}
.tstage img.in{clip-path:inset(0 0 0 0)}
.tstage img.enter{clip-path:inset(0 0 100% 0);transform:translateY(-3%)}
.tstage img.leave{transform:scale(.94);opacity:.0;transition:opacity .5s,transform .8s var(--ease-glaze)}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatches button{all:unset;cursor:pointer;display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:500}
.swatches button i{width:54px;height:62px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--c);transition:transform var(--t-base) var(--ease-set);position:relative}
.swatches button[aria-pressed="true"] i{transform:scale(1.14)}
.swatches button[aria-pressed="true"]{color:var(--maroon)}
.swatches button:focus-visible i{outline:2px solid var(--maroon)}
.roof{display:grid;grid-template-columns:repeat(8,1fr);gap:0;border-radius:14px;overflow:hidden;background:var(--glaze);padding:12px 12px 0;max-height:300px}
.roof .rt{aspect-ratio:.58;position:relative;margin-block-end:-62%;transform-origin:50% 0;background-size:contain;background-repeat:no-repeat;background-position:center top;filter:drop-shadow(0 6px 4px rgb(0 0 0/.35))}
.roof .row-odd{translate:-50% 0}
[dir="rtl"] .roof .row-odd{translate:50% 0}
.roof .rt.flip{animation:tflip .7s var(--ease-kiln) both;animation-delay:var(--dl)}
@keyframes tflip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@container site (max-width:760px){.tiles{grid-template-columns:1fr}.roof{grid-template-columns:repeat(6,1fr)}}

/* ---------- downloads ---------- */
.search{position:relative;max-width:520px;width:100%}
.search input{width:100%;padding:13px 16px;padding-inline-start:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;transition:border-color var(--t-quick),box-shadow var(--t-quick)}
.search input:focus{outline:0;border-color:var(--maroon);box-shadow:0 0 0 4px color-mix(in srgb,var(--maroon) 16%,transparent)}
.search svg{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:18px;stroke:var(--muted);fill:none;stroke-width:2}
.dl{display:grid;gap:8px}
.dl a,.dl .row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);transition:border-color var(--t-quick),transform var(--t-base) var(--ease-glaze);animation:fadeUp var(--t-base) var(--ease-glaze) both;animation-delay:calc(var(--i)*40ms)}
.dl a:hover{border-color:var(--maroon);transform:translateX(4px)}
[dir="rtl"] .dl a:hover{transform:translateX(-4px)}
.dl .ic{width:44px;height:50px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--sunk);display:grid;place-items:center;font:600 10px var(--font-data);color:var(--maroon)}
.dl h3{font-size:15.5px;font-family:var(--font-body);font-weight:600}
.dl p{font-size:12.5px;color:var(--muted)}
.dl mark{background:color-mix(in srgb,var(--maroon) 22%,transparent);color:inherit;border-radius:3px;padding-inline:1px}
.dl .meta{font:500 11.5px var(--font-data);color:var(--muted);text-align:end}

/* ---------- drawer / quote ---------- */
#scrim{position:absolute;inset:0;z-index:30;background:rgb(12 6 6/.4);opacity:0;pointer-events:none;transition:opacity var(--t-base)}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;z-index:31;width:min(420px,100%);background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto;transform:translateX(105%);transition:transform var(--t-slow) var(--ease-kiln)}
[dir="rtl"] #drawer{transform:translateX(-105%)}
#drawer.open{transform:none!important}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-block-end:1px solid var(--line)}
#drawer .body{overflow:auto;padding:16px 20px;display:grid;gap:10px;align-content:start}
#drawer footer{padding:16px 20px;border-block-start:1px solid var(--line);display:grid;gap:10px}
.qi{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;animation:fadeUp var(--t-base) var(--ease-glaze) both}
.qi.out{animation:out var(--t-base) var(--ease-glaze) forwards}

const K = 520/580; // px per mm of radius, fixed so size change is visible
let tw = null, cur = {d1:200,d3:242,d4:260};
function updatePipe(anim = true){
  const rows = PIPES[S.cls], r = rows[S.row]; if (!r) return;
  const target = { d1:r[4], d3:r[6], d4:r[9] || r[6]+8 };
  $$('#dnChips button').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.i===S.row));
  $$('#stBody tr, #stCards button').forEach(b=>b.classList.toggle('on', +b.dataset.i===S.row));
  $('#dnRange').value = S.row;
  $('#dnOut').textContent = r[0] + (rows.filter(x=>x[0]===r[0]).length>1?' '+r[1]:'');
  const u = t('x_units');
  const vals = [`${r[3]} ${u.kn}`, r[2], `${r[4]} ± ${r[5]}`, `${r[6]} ± ${r[7]}`, `${r[8]} ${u.mm}`, r[9]?`${r[9].toFixed(1)} ± 0.5`:'–', r[10]?`${r[10]} ± 0.5`:'–', r[11]?`${r[11]} ${u.kn}`:'–', `${r[12]} ${u.m}`];
  $$('#spec dd').forEach((dd,i)=>{ if (dd.textContent !== String(vals[i])){ dd.textContent = vals[i]; if(anim){dd.classList.remove('flash'); void dd.offsetWidth; dd.classList.add('flash');} } });
  // ghost (other class, same DN)
  const other = PIPES[S.cls==='N'?'H':'N'].find(x=>x[0]===r[0]);
  const g = $('#ghost'); const showG = S.compare && other;
  g.style.transition = 'opacity .4s'; g.setAttribute('opacity', showG?1:0); $('#legG').hidden = !showG;
  if (other){ $('#gOut').setAttribute('r', other[6]/2*K); $('#gIn').setAttribute('r', other[4]/2*K); }
  const from = {...cur}, t0 = performance.now(), dur = anim && !reduced() ? 620 : 0;
  cancelAnimationFrame(tw);
  const ease = x => 1 - Math.pow(1 - x, 4);
  const step = now => { const p = dur ? Math.min(1,(now-t0)/dur) : 1, e = ease(p);
    for (const k in target) cur[k] = from[k] + (target[k]-from[k])*e;
    drawPipe(r, p); if (p < 1) tw = requestAnimationFrame(step); };
  tw = requestAnimationFrame(step);
}
function drawPipe(r, p){
  const ro = cur.d3/2*K, ri = cur.d1/2*K, rs = cur.d4/2*K;
  $('#cOut').setAttribute('r', ro); $('#cIn').setAttribute('r', ri); $('#cSock').setAttribute('r', rs);
  $('#d1l').setAttribute('x1', -ri+14); $('#d1l').setAttribute('x2', ri-14); $('#d1l').setAttribute('y1',0); $('#d1l').setAttribute('y2',0);
  $('#d1a').setAttribute('d', `M${-ri+10} 0l22 -11v22zM${ri-10} 0l-22 -11v22z`);
  $('#d1t').setAttribute('x',0); $('#d1t').setAttribute('y', -18); $('#d1t').textContent = `d1 ${Math.round(cur.d1)}`;
  const a = -Math.PI/4, x1 = Math.cos(a)*ri, y1 = Math.sin(a)*ri, x2 = Math.cos(a)*(ro+60), y2 = Math.sin(a)*(ro+60);
  $('#wl').setAttribute('x1',x1); $('#wl').setAttribute('y1',y1); $('#wl').setAttribute('x2',x2); $('#wl').setAttribute('y2',y2);
  const wt = $('#wt'); wt.setAttribute('x', x2+8); wt.setAttribute('y', y2-6); wt.textContent = `${((cur.d3-cur.d1)/2).toFixed(0)} mm wall`;
}
function placePill(anim=true){
  const pill = $('#clsPill'); if (!pill) return; const b = $(`button[data-c="${S.cls}"]`, pill), ind = $('.ind', pill);
  const pr = pill.getBoundingClientRect(), br = b.getBoundingClientRect();
  if (!anim) ind.style.transition = 'none';
  const start = site.dir==='rtl' ? pr.right - br.right : br.left - pr.left;
  ind.style.insetInlineStart = start + 'px'; ind.style.width = br.width + 'px';
  if (!anim) requestAnimationFrame(()=>ind.style.transition='');
}

let io;
function setupReveal(){
  io?.disconnect();

  const sr = scroller.getBoundingClientRect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove('pre'); io.unobserve(e.target); } }), {root:scroller, rootMargin:'0px 0px -8% 0px'});

function setupCounts(){
  const els = $$('[data-count]', view); if (reduced()) return;
  const o = new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return; o.unobserve(e.target);
    const el = e.target, raw = el.dataset.count, n = parseInt(raw), suf = raw.replace(/\d/g,''), from = n > 1800 && n < 2100 ? n - 60 : 0, t0 = performance.now(), keep = el.innerHTML;
    const f = now => { const p = Math.min(1,(now-t0)/1200), v = Math.round(from + (n-from)*(1-Math.pow(1-p,3))); el.textContent = v + suf; if (p<1) requestAnimationFrame(f); else el.innerHTML = keep; };
    requestAnimationFrame(f); }), {root:scroller, threshold:.6});
  els.forEach(el=>o.observe(el)); cleanup.push(()=>o.disconnect());
}
function setupProcess(){
  const steps = $$('.step'), slides = $$('#pjVis .slide'), rail = $$('#rail i'); let cur = 0, dialRaf;
  const setStep = n => { if (n===cur) return; slides.forEach(s=>s.classList.remove('was')); slides[cur].classList.remove('on'); slides[cur].classList.add('was'); slides[n].classList.add('on'); cur = n;
    steps.forEach((s,i)=>s.classList.toggle('on', i===n)); $('#pjNum').textContent = String(n+1).padStart(2,'0');
    const dial = $('#dial'), fire = n===4; dial.classList.toggle('off', !fire); cancelAnimationFrame(dialRaf);
    if (fire){ const t0 = performance.now(), D = reduced()?1:1400; const f = now => { const p = Math.min(1,(now-t0)/D), e = 1-Math.pow(1-p,3); $('#dialArc').setAttribute('stroke-dashoffset', 100-100*e); $('#dialV').textContent = Math.round(1200*e)+'°C'; if(p<1) dialRaf=requestAnimationFrame(f); }; dialRaf = requestAnimationFrame(f); } };
  const stick = $('.pj-stick');
  const onS = () => { const sr = scroller.getBoundingClientRect(), stacked = stick.offsetWidth > stick.parentElement.offsetWidth*.8, mid = stacked ? stick.getBoundingClientRect().bottom + 90 : sr.top + sr.height*.5; let n = 0;
    steps.forEach((s,i)=>{ const r = s.getBoundingClientRect(); if (r.top < mid) n = i; const f = Math.max(0, Math.min(1, (mid - r.top)/r.height)); rail[i]?.style.setProperty('--f', f); });

/* Pipe assembly (M00, 0–1.2 s): three glazed pipes fly in and snap spigot-into-socket.
   Drawing style matches the How-it's-made film (fired glaze #4a2a1c, compression ring #cf4a2f). */
const PC = { fired:'#4a2a1c', edge:'#301b12', ring:'#cf4a2f', hot:'#ffb08a' };
const PL = 420, PD = 70, BL = PD*.9, BH = PD*1.3, OV = 52, PY = 80;
const PX = [20, 20 + PL - OV, 20 + 2*(PL - OV)];
const cl = (v,a=0,b=1)=>Math.min(b,Math.max(a,v)), sg = (t,a,b)=>cl((t-a)/(b-a));
const eOut = x => 1 - Math.pow(1-x,3), backE = x => { const c = 1.9; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
function pipeSide(x, y, rot, ringP, gloss){
  const bx = x, barrelX = x + BL, w = PL - BL;
  let g = `<rect x="${barrelX}" y="${y-PD/2}" width="${w}" height="${PD}" fill="${PC.fired}" stroke="${PC.edge}" stroke-width="2"/>`
    + `<rect x="${bx}" y="${y-BH/2}" width="${BL}" height="${BH}" rx="${PD*.1}" fill="${PC.fired}" stroke="${PC.edge}" stroke-width="2"/>`
    + `<rect x="${barrelX}" y="${y-PD/2}" width="${w}" height="${PD}" fill="url(#ip-shade)"/><rect x="${bx}" y="${y-BH/2}" width="${BL}" height="${BH}" rx="${PD*.1}" fill="url(#ip-shade)"/>`
    + `<rect x="${barrelX+10}" y="${y-PD*.33}" width="${w-20}" height="${PD*.07}" rx="3" fill="#fff" opacity="${.45*gloss}"/>`
    + `<rect x="${x+PL-PD*.16}" y="${y-PD/2-3}" width="${PD*.16}" height="${PD+6}" fill="${ringP>0?mixHex(PC.ring,PC.hot,ringP):PC.ring}"/>`
    + `<rect x="${bx}" y="${y-BH/2+2}" width="${PD*.08}" height="${BH-4}" fill="${PC.ring}"/>`;
  return rot ? `<g transform="rotate(${rot} ${x+PL/2} ${y})">${g}</g>` : g;
}
function mixHex(a,b,p){ const h=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)); const A=h(a),B=h(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p)).toString(16).padStart(2,'0')).join(''); }
function burst(x, y, p){ // spark burst at a joint when it seats
  if (p<=0 || p>=1) return ''; let s = '';
  for (let i=0;i<10;i++){ const a = i/10*Math.PI*2 + .3, r0 = 20 + 90*eOut(p)*.3, r1 = 30 + 110*eOut(p);
    s += `<line x1="${x+Math.cos(a)*r0}" y1="${y+Math.sin(a)*r0}" x2="${x+Math.cos(a)*r1}" y2="${y+Math.sin(a)*r1}" stroke="${PC.hot}" stroke-width="${4*(1-p)}" stroke-linecap="round" opacity="${1-p}"/>`; }
  return s + `<circle cx="${x}" cy="${y}" r="${18+50*eOut(p)}" fill="none" stroke="#fff" stroke-width="${3*(1-p)}" opacity="${.8*(1-p)}"/>`;
}
function pipesFrame(t){
  // arrival windows (s): pipe 0 from the left, pipe 1 drops from above, pipe 2 from the right
  const a0 = backE(sg(t,.05,.45)), a1 = backE(sg(t,.28,.68)), a2 = backE(sg(t,.5,.9));
  const x0 = -1100 + (PX[0]+1100)*a0, y1 = -520 + (PY+520)*a1, x2 = 2300 + (PX[2]-2300)*a2;
  const r1 = (1-a1)*-14;
  const seat = [ .68, .9 ], jx = [PX[1]+BL*.5, PX[2]+BL*.5];
  const glossSweep = sg(t, 1.5, 2.8);
  let s = `<defs><linearGradient id="ip-shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
    <linearGradient id="ip-sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="ip-clip">${PX.map(x=>`<rect x="${x}" y="${PY-BH/2}" width="${PL}" height="${BH}"/>`).join('')}</clipPath></defs>`;
  s += `<ellipse cx="600" cy="${PY+BH/2+14}" rx="${560*cl(a0*.4+a1*.3+a2*.3)}" ry="8" fill="#000" opacity=".35"/>`;
  s += pipeSide(x0, PY, 0, sg(t,seat[0],seat[0]+.35) ? 1-sg(t,seat[0],seat[0]+.35) : 0, 1);
  s += pipeSide(PX[1], y1, r1, sg(t,seat[1],seat[1]+.35) ? 1-sg(t,seat[1],seat[1]+.35) : 0, 1);
  s += pipeSide(x2, PY, 0, 0, 1);
  if (glossSweep > 0 && glossSweep < 1) s += `<rect clip-path="url(#ip-clip)" x="${-200 + 1400*glossSweep}" y="0" width="220" height="160" fill="url(#ip-sweep)"/>`;
  s += burst(jx[0], PY, sg(t, seat[0], seat[0]+.32)) + burst(jx[1], PY, sg(t, seat[1], seat[1]+.32));
  return s;
}
function assemble(){
  const svg = $('#ipipes'), intro = $('#intro'); if (!svg) return;
  // start centred and larger, then settle into its slot under the logo
  const ir = intro.getBoundingClientRect(), sr = svg.getBoundingClientRect();
  const dy = (ir.top + ir.height/2) - (sr.top + sr.height/2);
  const sc = Math.max(1, Math.min(1.9, ir.width*.9/sr.width));
  svg.classList.remove('settle'); svg.style.transform = `translateY(${dy}px) scale(${sc})`;
  const t0 = performance.now(); let settled = false;
  const loop = now => { if (!svg.isConnected) return; const t = (now - t0)/1000;
    // joint "thud": tiny shake as each spigot seats
    const k = Math.max(0, 1 - Math.abs(t-.72)/.12) + Math.max(0, 1 - Math.abs(t-.94)/.12);
    const shake = k ? `translate(${(Math.random()-.5)*10*k} ${(Math.random()-.5)*6*k})` : '';
    svg.innerHTML = `<g transform="${shake}">${pipesFrame(t)}</g>`;
    if (!settled && t > 1.1){ settled = true; svg.classList.add('settle'); svg.style.transform = 'none'; }
    if (t < 3) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
function endIntro(){
  const el = $('#intro'); if (el.hidden || el.classList.contains('out')) return;
  introT.forEach(clearTimeout); el.classList.add('out');
  setTimeout(()=>{ el.hidden = true; el.innerHTML = ''; }, reduced() ? 220 : 720);
  view.classList.remove('view-enter'); void view.offsetWidth; if (!reduced()) view.classList.add('view-enter');
}
function sparks(cv){ // kiln embers rising, drift with the pointer
  const ctx = cv.getContext('2d'), r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio||1);
  cv.width = r.width*dpr; cv.height = r.height*dpr; ctx.scale(dpr,dpr);
  const P = Array.from({length:46}, () => ({ x: Math.random()*r.width, y: r.height + Math.random()*r.height*.6, v: .4+Math.random()*1.3, s: .6+Math.random()*1.8, a: .3+Math.random()*.6 }));
  const loop = () => { if (!cv.isConnected) return; ctx.clearRect(0,0,r.width,r.height);
    const px = +$('#intro').style.getPropertyValue('--px') || 0;
    for (const p of P){ p.y -= p.v; p.x += px*.8 + Math.sin(p.y/40)*.3; if (p.y < -10){ p.y = r.height+10; p.x = Math.random()*r.width; }
      ctx.fillStyle = `rgba(255,${120+Math.round(p.a*80)},70,${p.a*(p.y/r.height)})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); }
    requestAnimationFrame(loop); };
  loop();
}
$('#intro').addEventListener('pointermove', e => { if (reduced()) return; const r = e.currentTarget.getBoundingClientRect();
  e.currentTarget.style.setProperty('--px', ((e.clientX - r.left)/r.width - .5)*2); e.currentTarget.style.setProperty('--py', ((e.clientY - r.top)/r.height - .5)*2); });
$('#intro').addEventListener('click', endIntro);
document.addEventListener('keydown', e => { if (!$('#intro').hidden && (e.key==='Escape'||e.key==='Enter'||e.key===' ')) endIntro(); });

  return _about().replace(/<section><div class="wrap about-grid">[\s\S]*$/, '') + `${jdiv()}
  <section class="her" id="her" style="padding-block:0"><div class="her-pin" id="herPin"><div class="wrap her-top"><div style="display:grid;gap:8px"><div class="eyebrow">${t('h_eyebrow2')}</div><h2>${t('h_title2')}</h2><p class="muted">${t('h_lede2')}</p></div>
    <div style="display:grid;gap:10px;justify-items:end"><div class="her-year" id="herYear">1935</div><div class="growth" id="growth">${reach}</div></div></div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto;gap:14px;min-height:0"><div class="her-track" id="herTrack" style="padding-inline:clamp(16px,4cqi,40px)">${cards}</div>
    <div class="wrap"><div class="her-bar"><i id="herBar"></i></div></div></div></div></section>
  <section><div class="wrap"><div class="ctl"><span class="lbl">${t('a_certs')}</span><div class="certs">${['ES 56/2005','SASO GSO EN 295/2008','EN 295','ZPWN 295:2016','ASTM C700','ISO 9001:2015','ISO 14001:2015','ISO 45001'].map(c=>`<span class="chip mono">${c}</span>`).join('')}</div></div></div></section>`;
};
AFTER.about = function(){
  const her = $('#her'), pin = $('#herPin'), track = $('#herTrack'), cards = $$('.her-card', track), yEl = $('#herYear'); if (!her) return;
  const H = t('her'); let cur = -1, yTw;
  const layout = () => { const hdr = $('#hdr').offsetHeight, ph = scroller.clientHeight - hdr; pin.style.top = hdr + 'px'; pin.style.height = ph + 'px';
    track.style.height = Math.max(280, ph - pin.firstElementChild.offsetHeight - 70) + 'px'; her.style.height = (ph + Math.max(0, track.scrollWidth - track.clientWidth) + ph*.4) + 'px'; onS(); };
  const setYear = i => { const y = H[i][0]; cancelAnimationFrame(yTw);
    if (!y){ yEl.classList.add('u'); yEl.textContent = i === H.length-1 ? t('her_today') : t('her_tbc'); return; }
    yEl.classList.remove('u'); const to = +y, fromY = parseInt(yEl.textContent) || to; if (reduced() || fromY === to){ yEl.textContent = to; return; }
    const t0 = performance.now(); const f = now => { const p = Math.min(1,(now-t0)/600); yEl.textContent = Math.round(fromY + (to-fromY)*(1-Math.pow(1-p,3))); if (p<1) yTw = requestAnimationFrame(f); }; yTw = requestAnimationFrame(f); };
  const onS = () => { const hdr = $('#hdr').offsetHeight, sr = scroller.getBoundingClientRect(), hr = her.getBoundingClientRect(), ph = pin.offsetHeight;
    const p = Math.max(0, Math.min(1, (sr.top + hdr - hr.top) / Math.max(1, hr.height - ph)));
    const max = Math.max(0, track.scrollWidth - track.clientWidth); track.style.transform = `translateX(${(site.dir==='rtl' ? 1 : -1) * p * max}px)`;
    $('#herBar').parentElement.style.setProperty('--p', p); $('#herBar').style.transform = `scaleX(${p})`;
    const i = Math.min(cards.length-1, Math.round(p * (cards.length-1)));
    if (i !== cur){ cur = i; cards.forEach((c,k) => c.classList.toggle('on', k === i)); setYear(i);
      $$('#growth span').forEach(s => s.classList.toggle('on', +s.dataset.r <= HER_REACH[i])); $$('#growth b').forEach((b,k) => b.style.setProperty('--g', k+2 <= HER_REACH[i] ? 1 : 0)); } };
  scroller.addEventListener('scroll', onS, { passive:true }); const ro = new ResizeObserver(layout); ro.observe(scroller);
  cleanup.push(() => { scroller.removeEventListener('scroll', onS); ro.disconnect(); cancelAnimationFrame(yTw); });
  layout();
};

/* ---------- size calculator (Manning, partially full circular pipe) ---------- */
S.c = { q:60, s:0.5, n:'0.013', h:0.7 };
const CALC_DN = (() => { const m = new Map(); ['N','H'].forEach(c => PIPES[c].forEach(r => { const e = m.get(r[0]) || { dn:r[0], d1:r[4], cls:[] }; if (!e.cls.includes(c)) e.cls.push(c); m.set(r[0], e); })); return [...m.values()].sort((a,b)=>a.dn-b.dn); })();
function manning(D, S_, n, h){ // D m, S m/m, h = y/D → { Q m3/s, A, V }
  const th = 2*Math.acos(1 - 2*h), A = D*D/8*(th - Math.sin(th)), P = D*th/2, R = A/P, V = Math.pow(R, 2/3)*Math.sqrt(S_)/n;
  return { Q: A*V, A, V };
}
function sizeFor(){ const { q, s, n, h } = S.c, Sm = s/100, nn = +n, Q = q/1000;
  const rows = CALC_DN.map(e => ({ ...e, cap: manning(e.d1/1000, Sm, nn, h).Q*1000 }));
  const pick = rows.find(r => r.cap >= q);
  let v = null, y = null;
  if (pick){ let lo = 0.001, hi = h; for (let k=0;k<50;k++){ const mid = (lo+hi)/2; manning(pick.d1/1000, Sm, nn, mid).Q < Q ? lo = mid : hi = mid; } y = (lo+hi)/2; v = manning(pick.d1/1000, Sm, nn, y).V; }
  return { rows, pick, v, y };
}
SCREENS.calc = () => `<div class="wrap"><div class="page-head"><div class="eyebrow">${t('c_eyebrow')}</div><h1 style="font-size:clamp(30px,4.4cqi,54px)">${t('c_h')}</h1><p class="lede">${t('c_p')}</p></div></div>
  <section style="padding-block-start:24px"><div class="wrap calc">
    <div class="panel">
      <div class="ctl"><label for="cq">${t('c_q')}</label><div class="num"><input type="number" id="cq" min="1" max="3000" step="1" value="${S.c.q}"><span>L/s</span></div><input class="range" type="range" id="cqr" min="0" max="100" step="0.5" value="${Math.log10(S.c.q)/Math.log10(3000)*100}" aria-label="${t('c_q')}"></div>
      <div class="ctl"><label for="cs">${t('c_s')}</label><div class="num"><input type="number" id="cs" min="0.05" max="10" step="0.05" value="${S.c.s}"><span>% (${(S.c.s*10).toFixed(1)} ‰)</span></div><input class="range" type="range" id="csr" min="0.05" max="5" step="0.05" value="${S.c.s}" aria-label="${t('c_s')}"></div>
      <div class="ctl"><span class="lbl">${t('c_n')}</span><div class="fams" id="cn">${t('c_nopts').map(([v,l])=>`<button data-n="${v}" aria-pressed="${S.c.n===v}">${l}</button>`).join('')}</div></div>
      <div class="ctl"><span class="lbl">${t('c_fill')}</span><div class="fams" id="ch">${[0.5,0.7,0.8,1].map(v=>`<button data-h="${v}" aria-pressed="${S.c.h===v}">${v===1?'1.0 · full':v}</button>`).join('')}</div></div>
      <p class="note">${t('c_note')}</p>
    </div>
    <div style="display:grid;gap:16px;min-width:0"><div class="res" id="cres"></div><div class="res cchart"><span class="note" style="margin:0">${t('c_chart')}</span><div id="cchart"></div></div></div>
  </div></section>`;
let lastPick = null;
function renderCalc(){
  const box = $('#cres'); if (!box) return; const { rows, pick, v, y } = sizeFor(); const u = S.lang === 'ar' ? { ls:'ل/ث', ms:'م/ث' } : { ls:'L/s', ms:'m/s' };
  if (!pick){ box.innerHTML = `<div class="empty" style="border:0;padding:12px"><h3>${t('c_none_h')}</h3><p>${t('c_none_p')}</p><a class="btn btn-ghost" data-go="quote">${t('nav_contact')}</a></div>`; lastPick = null; }
  else {
    const st = v < .6 ? ['warn', t('c_vlow')] : v > 3 ? ['warn', t('c_vhigh')] : ['ok', t('c_vok')];
    box.innerHTML = `<span class="lbl" style="font:500 11px var(--font-data);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)">${t('c_res')}</span>
      <div class="res-big ${lastPick!==pick.dn?'pop':''}"><b>DN ${pick.dn}</b><span class="muted mono">d1 ${pick.d1} mm</span></div>
      <dl class="kv"><div><dt>${t('c_cap')}</dt><dd>${pick.cap.toFixed(pick.cap<100?1:0)} ${u.ls}</dd></div><div><dt>${t('c_v')}</dt><dd>${v.toFixed(2)} ${u.ms}</dd></div><div><dt>${t('c_depth')}</dt><dd>y/D ${y.toFixed(2)}</dd></div></dl>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="pillst ${st[0]}">${t('c_self')}: ${st[1]}</span><span class="muted" style="font-size:13px">${t('c_cls')}: ${pick.cls.join(' · ')}</span></div>
      <div class="addrow"><button class="btn btn-primary" id="cAdd">${t('c_add')} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><a class="link" data-go="viewer" id="c3d">${t('tool3d_h')}</a></div>`;
    lastPick = pick.dn;
  }
  // log-scale capacity chart
  const W = 560, rowH = 22, padL = 64, padR = 64, top = 8, H = top + rows.length*rowH + 26, min = 1, max = 10000;
  const x = val => padL + (Math.log10(Math.max(min, Math.min(max, val))) - 0) / 4 * (W - padL - padR);
  const ticks = [1,10,100,1000,10000];
  $('#cchart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" dir="ltr" role="img" aria-label="${esc(t('c_chart'))}">
    ${ticks.map(tk=>`<line x1="${x(tk)}" x2="${x(tk)}" y1="${top-4}" y2="${H-22}" stroke="var(--line)"/><text x="${x(tk)}" y="${H-8}" text-anchor="middle">${tk>=1000?tk/1000+'k':tk}</text>`).join('')}
    ${rows.map((r,i)=>`<text x="${padL-8}" y="${top+i*rowH+15}" text-anchor="end">DN ${r.dn}</text><rect class="bar ${pick&&r.dn===pick.dn?'pick':r.cap>=S.c.q?'fit':''}" x="${padL}" y="${top+i*rowH+4}" height="${rowH-8}" rx="3" width="${Math.max(1, x(r.cap)-padL)}"/><text x="${Math.min(x(r.cap)+6, W-4)}" y="${top+i*rowH+15}" ${x(r.cap)+6 > W-60 ? 'text-anchor="end" style="fill:var(--surface)"' : ''}>${r.cap<10?r.cap.toFixed(1):Math.round(r.cap)}</text>`).join('')}
    <line class="req" x1="${x(S.c.q)}" x2="${x(S.c.q)}" y1="${top-6}" y2="${H-22}"/><text x="${x(S.c.q)+4}" y="${top+4}" style="fill:var(--ink);font-weight:600">${S.c.q} ${u.ls}</text></svg>`;
}
AFTER.calc = renderCalc;
site.addEventListener('input', e => {
  const id = e.target.id; if (!['cq','cqr','cs','csr'].includes(id)) return;
  if (id === 'cq'){ S.c.q = Math.max(1, Math.min(3000, +e.target.value || 1)); $('#cqr').value = Math.log10(S.c.q)/Math.log10(3000)*100; }
  if (id === 'cqr'){ S.c.q = Math.max(1, Math.round(Math.pow(3000, e.target.value/100))); $('#cq').value = S.c.q; }
  if (id === 'cs'){ S.c.s = Math.max(.05, Math.min(10, +e.target.value || .05)); $('#csr').value = S.c.s; }
  if (id === 'csr'){ S.c.s = +e.target.value; $('#cs').value = S.c.s; }
  $('#cs').nextElementSibling.textContent = `% (${(S.c.s*10).toFixed(1)} ‰)`; renderCalc();
});
site.addEventListener('click', e => {
  const n = e.target.closest('#cn button'); if (n){ S.c.n = n.dataset.n; $$('#cn button').forEach(b=>b.setAttribute('aria-pressed', b===n)); return renderCalc(); }
  const h = e.target.closest('#ch button'); if (h){ S.c.h = +h.dataset.h; $$('#ch button').forEach(b=>b.setAttribute('aria-pressed', b===h)); return renderCalc(); }
  if (e.target.closest('#c3d')){ const p = CALC_DN.find(r=>r.dn===lastPick); if (p){ S.v.cls = p.cls.includes('H') && !p.cls.includes('N') ? 'H' : 'N'; S.v.row = PIPES[S.v.cls].findIndex(r=>r[0]===p.dn); } }
  if (e.target.closest('#cAdd')){ const p = CALC_DN.find(r=>r.dn===lastPick); if (!p) return; const cls = p.cls.includes('N') ? 'N' : 'H', rows = PIPES[cls];
    const idx = rows.findIndex(r=>r[0]===p.dn && r[1]==='C') >= 0 ? rows.findIndex(r=>r[0]===p.dn && r[1]==='C') : rows.findIndex(r=>r[0]===p.dn);
    const keep = { cls:S.cls, row:S.row }; S.cls = cls; S.row = idx; const btn = $('#cAdd'); btn.id = 'addQ'; if (!$('#qv')) btn.insertAdjacentHTML('afterend','<input id="qv" value="1" hidden>');
    addToQuote(); btn.id = 'cAdd'; $('#qv')?.hidden && $('#qv').remove(); Object.assign(S, keep); }
});

/* ---------- kiln theme ---------- */
S.kiln = false; try { S.kiln = localStorage.getItem('sw-kiln') === '1'; } catch (e) {}
const emberIcon = on => on
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-5-4-7-5-12-2 3-3 5-3 7-1-1-2-2-2-4-2 2-4 5-4 9 0 4 3 7 7 7z"/></svg>';
function setKiln(on, origin){
  const apply = () => { S.kiln = on; site.classList.toggle('kiln', on); try { localStorage.setItem('sw-kiln', on ? '1' : '0'); } catch (e) {}
    const tb = $('#themeBtn'); if (tb){ tb.innerHTML = emberIcon(on); tb.setAttribute('aria-label', on ? t('kiln_off') : t('kiln_on')); }
    $$('#thSeg button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.th === 'kiln') === on));
    $$('.mm-theme').forEach(b => b.innerHTML = `${emberIcon(on)}${on ? t('kiln_off') : t('kiln_on')}`); if (on) embers(); };
  if (document.startViewTransition && !reduced() && origin){ const r = origin.getBoundingClientRect(); const h = document.documentElement;
    h.style.setProperty('--vx', (r.left + r.width/2) + 'px'); h.style.setProperty('--vy', (r.top + r.height/2) + 'px'); h.classList.add('kiln-vt');
    document.startViewTransition(apply).finished.finally(() => h.classList.remove('kiln-vt')); }
  else apply();
}
let emRaf;
function embers(){
  const cv = $('#embers'); if (!cv || emRaf) return; const ctx = cv.getContext('2d'); let P = [], W = 0, H = 0;
  const size = () => { const r = site.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
    P = Array.from({ length: Math.round(W*H/16000) }, () => ({ x: Math.random()*W, y: Math.random()*H, v: .15 + Math.random()*.5, s: .5 + Math.random()*1.6, a: .15 + Math.random()*.5, w: Math.random()*6.28 })); };
  size(); new ResizeObserver(size).observe(site);
  const loop = () => { emRaf = requestAnimationFrame(loop); if (!S.kiln){ ctx.clearRect(0,0,W,H); return; } ctx.clearRect(0,0,W,H);
    const g = ctx.createRadialGradient(W/2, H*1.1, 0, W/2, H*1.1, H*.9); g.addColorStop(0,'rgba(255,90,40,.16)'); g.addColorStop(1,'rgba(255,90,40,0)'); ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    if (reduced()) return;
    for (const p of P){ p.y -= p.v; p.w += .02; p.x += Math.sin(p.w)*.25; if (p.y < -6){ p.y = H + 6; p.x = Math.random()*W; }
      ctx.fillStyle = `rgba(255,${130 + Math.round(p.a*90)},70,${p.a * Math.min(1, p.y/H + .2)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill(); } };
  loop();
}
site.addEventListener('click', e => { const b = e.target.closest('#themeBtn, .mm-theme'); if (b) setKiln(!S.kiln, b); });
$('#thSeg').onclick = e => { const b = e.target.closest('button'); if (b) setKiln(b.dataset.th === 'kiln', b); };
if (S.kiln){ site.classList.add('kiln'); $$('#thSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === 'kiln')); requestAnimationFrame(embers); }

AFTER.viewer = setupViewer;

const start = (location.hash||'').slice(1);
go(SCREENS[start] ? start : 'home', {vt:false});
playIntro();
</script>
