<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How a SWEILLEM clay pipe is made</title>
  <meta name="description" content="Animated walkthrough of how SWEILLEM vitrified clay pipes are made, from Aswan clay to an installed sewer line.">
  <link rel="stylesheet" href="how-its-made.css">
  <style>
    body { margin: 0; background: #fffdfb; }
    main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-family: 'Space Grotesk', Inter, sans-serif; font-size: clamp(28px, 4vw, 44px); margin: 0 0 8px; color: #3b3530; }
    p.lede { font-family: Inter, sans-serif; color: #6d625a; margin: 0 0 24px; max-width: 60ch; }
    body.render main { max-width: none; padding: 0; }
    body.render h1, body.render p.lede { display: none; }
    body.render .hm-stage { border-radius: 0; box-shadow: none; width: 1920px; height: 1080px; }
  </style>
</head>
<body>
  <main>
    <h1>How a SWEILLEM clay pipe is made</h1>
    <p class="lede">From clay at the Aswan quarry to a watertight sewer line underground. Pick a step to jump to it.</p>
    <div id="how-its-made"></div>
  </main>
  <script type="module">
    import { mount, frameSVG } from './how-its-made.js';
    const params = new URLSearchParams(location.search);
    const el = document.getElementById('how-its-made');
    if (params.has('render')) {
      // Frame-exact mode used by scripts/render.mjs.
      document.body.classList.add('render');
      const player = mount(el, { autoplay: false, controls: false });
      window.__hm = { seek: (t) => player.seek(t) };
    } else {
      window.__hm = mount(el, { autoplay: true });
    }
  </script>
</body>
</html>
