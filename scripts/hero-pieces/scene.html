<!-- Studio scene for scripts/render-hero-pieces.mjs: one glazed clay piece per load, picked by ?w= -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as T from "three";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
const q=new URLSearchParams(location.search); const what=q.get("w"); const S=+(q.get("s")||1400);
const r=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setPixelRatio(1); r.setSize(S,S); r.setClearColor(0,0); r.toneMapping=T.AgXToneMapping; r.toneMappingExposure=+(q.get("ex")||1.15); r.outputColorSpace=T.SRGBColorSpace;
document.body.appendChild(r.domElement);
// ---------- noise ----------
let seed=+(q.get("seed")||7); const rnd=()=>{seed=(seed*16807)%2147483647; return (seed-1)/2147483646;};
const P=new Uint8Array(512); {const p=[...Array(256).keys()]; for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]];} for(let i=0;i<512;i++)P[i]=p[i&255];}
const fade=t=>t*t*t*(t*(t*6-15)+10), lerp=(a,b,t)=>a+(b-a)*t;
function grad(h,x,y){const u=h&1?x:-x, v=h&2?y:-y; return (h&4)?u+v*0.5:u*0.5+v;}
function n2(x,y){const X=Math.floor(x)&255,Y=Math.floor(y)&255; x-=Math.floor(x); y-=Math.floor(y); const u=fade(x),v=fade(y);
 const a=P[X]+Y,b=P[X+1]+Y; return lerp(lerp(grad(P[a],x,y),grad(P[b],x-1,y),u),lerp(grad(P[a+1],x,y-1),grad(P[b+1],x-1,y-1),u),v);}
function fbm(x,y,o=5){let s=0,a=0.5,f=1;for(let i=0;i<o;i++){s+=a*n2(x*f,y*f);a*=0.5;f*=2;}return s;}
// tileable in x by sampling on a cylinder-ish wrap: use 4D trick approx -> blend
function tex(w,h,fn){const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");const im=g.createImageData(w,h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const [R,G,B]=fn(x/w,y/h);const i=(y*w+x)*4;im.data[i]=R;im.data[i+1]=G;im.data[i+2]=B;im.data[i+3]=255;}
 g.putImageData(im,0,0);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=8;return t;}
const wrapN=(u,v,sx,sy,o)=>{const a=fbm(u*sx,v*sy,o),b=fbm((u-1)*sx,v*sy,o);return lerp(a,b,u);} // seamless in u
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function glazeMaps(base,dark,light,st=1){
 const B=hex(base),D=hex(dark),L=hex(light);
 const col=tex(1024,1024,(u,v)=>{const m=wrapN(u,v,6,6,5)*1.4; const streak=wrapN(u,v,24,3,2); const pool=Math.pow(Math.max(0,1-v*1.0),6)*0.0;
   let t=0.5+m*0.5+streak*0.08*st; t=Math.min(1,Math.max(0,t));
   const c=t<0.5?B.map((b,i)=>lerp(D[i],b,t*2)):B.map((b,i)=>lerp(b,L[i],(t-0.5)*2));
   const speck=fbm(u*400,v*400,1)>0.42?0.82:1; return c.map(x=>x*speck);});
 col.colorSpace=T.SRGBColorSpace;
 const rough=tex(512,512,(u,v)=>{const m=0.5+wrapN(u,v,10,10,4)*0.8;const x=Math.floor(Math.min(1,Math.max(0,m))*255);return [x,x,x];});
 const bump=tex(1024,1024,(u,v)=>{const m=0.5+wrapN(u,v,90,90,3)*0.6+wrapN(u,v,30,1,2)*0.3*st;const x=Math.floor(Math.min(1,Math.max(0,m))*255);return [x,x,x];});
 return {col,rough,bump};
}
function clayMaps(base,dark,light,sc=8){
 const B=hex(base),D=hex(dark),L=hex(light);
 const col=tex(1024,1024,(u,v)=>{let t=0.5+wrapN(u,v,sc,sc,6)*0.9; t=Math.min(1,Math.max(0,t));
  const c=t<0.5?B.map((b,i)=>lerp(D[i],b,t*2)):B.map((b,i)=>lerp(b,L[i],(t-0.5)*2)); const sp=fbm(u*300,v*300,1); const k=sp>0.45?0.75:sp<-0.5?1.12:1; return c.map(x=>Math.min(255,x*k));});
 col.colorSpace=T.SRGBColorSpace;
 const bump=tex(1024,1024,(u,v)=>{const m=0.5+wrapN(u,v,120,120,3)*0.9;const x=Math.floor(Math.min(1,Math.max(0,m))*255);return [x,x,x];});
 return {col,bump};
}
const G={
 brown:(st)=>{const m=glazeMaps("#5a2a16","#2c1209","#8a4a26",st);return new T.MeshPhysicalMaterial({map:m.col,roughnessMap:m.rough,roughness:0.22,bumpMap:m.bump,bumpScale:0.6,clearcoat:1,clearcoatRoughness:0.04,specularIntensity:1,ior:1.52,side:T.DoubleSide});},
 dark:()=>{const m=glazeMaps("#2e160d","#120604","#53301d");return new T.MeshPhysicalMaterial({map:m.col,roughnessMap:m.rough,roughness:0.2,bumpMap:m.bump,bumpScale:0.6,clearcoat:1,clearcoatRoughness:0.03,ior:1.52,side:T.DoubleSide});},
 honey:()=>{const m=glazeMaps("#8e4a22","#5a2810","#c0743c");return new T.MeshPhysicalMaterial({map:m.col,roughnessMap:m.rough,roughness:0.24,bumpMap:m.bump,bumpScale:0.6,clearcoat:1,clearcoatRoughness:0.05,ior:1.52,side:T.DoubleSide});},
 body:()=>{const m=clayMaps("#a8592f","#7c3a1c","#c98352");return new T.MeshStandardMaterial({map:m.col,roughness:0.93,bumpMap:m.bump,bumpScale:1.6,side:T.DoubleSide});},
};
// ---------- studio environment (softboxes) ----------
const env=new T.Scene(); env.background=new T.Color(q.get("bg")||"#2a1a12");
const box=(w,h,x,y,z,ry,rx,int,c="#ffffff")=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(c).multiplyScalar(int),side:T.DoubleSide}));m.position.set(x,y,z);m.rotation.y=ry;m.rotation.x=rx||0;env.add(m);};
box(1.6,9,-6,0,2,Math.PI/2.4,0,9,"#fff1e2");   // key strip left
box(1.0,9,6,0,-1,-Math.PI/2.2,0,5,"#ffd9b8");  // rim strip right
box(8,8,0,7,0,0,Math.PI/2,2.2,"#fff6ee");     // top
box(10,4,0,-6,0,0,-Math.PI/2,0.6,"#c4643a");  // warm floor bounce
box(3,9,0,0,-7,0,0,1.2,"#ffe6d0");            // back fill
const pm=new T.PMREMGenerator(r); const sc=new T.Scene(); sc.environment=pm.fromScene(env,0.02).texture;
const key=new T.DirectionalLight(0xfff0e2,1.6); key.position.set(-4,6,5); sc.add(key);
const rim=new T.DirectionalLight(0xffcfa8,1.2); rim.position.set(5,3,-4); sc.add(rim);
// ---------- geometry helpers ----------
function rounded(pts,rad=0.012,seg=5){ // fillet polyline corners
 const out=[]; for(let i=0;i<pts.length;i++){const p=pts[i]; if(i===0||i===pts.length-1){out.push(p);continue;}
  const a=pts[i-1],b=pts[i+1]; const d1=p.clone().sub(a),d2=b.clone().sub(p); const l1=d1.length(),l2=d2.length(); const rr=Math.min(rad,l1/2.2,l2/2.2);
  const s=p.clone().sub(d1.normalize().multiplyScalar(rr)), e=p.clone().add(d2.normalize().multiplyScalar(rr));
  for(let k=0;k<=seg;k++){const t=k/seg; const q1=s.clone().lerp(p,t),q2=p.clone().lerp(e,t); out.push(q1.lerp(q2,t));}}
 return out;}
function lathe(points,mat){const g=new T.LatheGeometry(rounded(points.map(([x,y])=>new T.Vector2(x,y))),240); g.computeVertexNormals(); return new T.Mesh(g,mat);}
// standing pipe, socket up. ro outer, wall thickness w
function pipe(len,ro,mat){const w=ro*0.16, ri=ro-w, so=ro*1.3, si=so-w*0.95, sh=ro*0.55, tr=ro*0.28;
 const pts=[[ri+w*0.5,0],[ro,0],[ro,len-sh-tr],[so,len-sh],[so,len],[si,len],[si,len-sh*0.85],[ri,len-sh*0.85-tr*0.9],[ri,0.0],[ri+w*0.5,0]];
 const g=new T.Group(); g.add(lathe(pts,mat));
 // rubber seal visible inside socket
 const seal=new T.Mesh(new T.TorusGeometry(si-0.004,w*0.18,16,200),new T.MeshStandardMaterial({color:"#141414",roughness:0.55})); seal.rotation.x=Math.PI/2; seal.position.y=len-sh*0.5; g.add(seal);
 return g;}
function shortPiece(ro,mat){return pipe(ro*1.25,ro,mat);}
function bend(ro,mat){const g=new T.Group(); const R=ro*2.2, w=ro*0.16;
 const path=new T.CurvePath(); const arc=new T.EllipseCurve(0,0,R,R,0,Math.PI/2.6,false);
 const pts=arc.getPoints(60).map(p=>new T.Vector3(p.x,p.y,0)); const curve=new T.CatmullRomCurve3(pts);
 const outer=new T.Mesh(new T.TubeGeometry(curve,120,ro,120,false),mat); g.add(outer);
 const inner=new T.Mesh(new T.TubeGeometry(curve,120,ro-w,120,false),mat); g.add(inner);
 const sock=pipe(ro*0.9,ro,mat); sock.position.set(R,0,0); sock.rotation.z=Math.PI; g.add(sock); // socket at the start end
 const end=pts[pts.length-1]; const tan=curve.getTangent(1); const ring=lathe([[ro-w,0],[ro,0],[ro,0.002],[ro-w,0.002]],mat); 
 return g;}
function junction(ro,mat){const g=new T.Group(); const main=pipe(ro*5,ro,mat); g.add(main);
 const br=pipe(ro*2.4,ro*0.8,mat); br.rotation.z=-Math.PI/4; br.position.set(ro*0.5,ro*1.6,0); g.add(br); return g;}
// shard: curved piece of pipe wall; glazed outer, clay broken edges
function shard(R,w,mat,edge,arc=0.9,h=0.8){
 const NU=60,NV=40; const jag=[];const o=rnd()*100;
 const topY=u=>h*(0.75+0.25*Math.sin(u*3.1+o)+0.18*fbm(u*4+o,1.3,3)+0.08*((Math.floor(u*7+o)%2)?1:-1)*(u%0.14));
 const botY=u=>h*(0.1*Math.cos(u*2.3+o)+0.15*fbm(u*5+o,7.1,3));
 const pos=[],uv=[],idxO=[],idxE=[];
 const P=(th,y,rad)=>[Math.sin(th)*rad,y,Math.cos(th)*rad-R];
 const add=(a,t)=>{pos.push(...a);uv.push(...t);return pos.length/3-1;};
 const grid=(rad,flip)=>{const base=pos.length/3; for(let j=0;j<=NV;j++)for(let i=0;i<=NU;i++){const u=i/NU,v=j/NV; const th=(u-0.5)*arc; const y=lerp(botY(u),topY(u),v); add(P(th,y,rad),[u*arc*R,y]);}
  for(let j=0;j<NV;j++)for(let i=0;i<NU;i++){const a=base+j*(NU+1)+i,b=a+1,c=a+NU+1,d=c+1; if(flip)idxO.push(a,c,b,b,c,d); else idxO.push(a,b,c,b,d,c);} return base;};
 const bo=grid(R,false), bi=grid(R-w,true);
 // edges: top & bottom rows, left & right columns
 const strip=(ia,ib,n,step)=>{for(let k=0;k<n;k++){const a=ia+k*step,b=a+step,c=ib+k*step,d=c+step; const A=add(pos.slice(a*3,a*3+3),[k/n,0]),B=add(pos.slice(b*3,b*3+3),[(k+1)/n,0]),C=add(pos.slice(c*3,c*3+3),[k/n,0.05]),D=add(pos.slice(d*3,d*3+3),[(k+1)/n,0.05]); idxE.push(A,B,C,B,D,C);}};
 strip(bo+NV*(NU+1),bi+NV*(NU+1),NU,1); strip(bi,bo,NU,1); strip(bi,bo,NV,NU+1); strip(bo+NU,bi+NU,NV,NU+1);
 const g=new T.BufferGeometry(); g.setAttribute("position",new T.Float32BufferAttribute(pos,3)); g.setAttribute("uv",new T.Float32BufferAttribute(uv,2));
 g.setIndex([...idxO,...idxE]); g.addGroup(0,idxO.length,0); g.addGroup(idxO.length,idxE.length,1); g.computeVertexNormals();
 return new T.Mesh(g,[mat,edge]);}
function pebble(mat){let g=new T.IcosahedronGeometry(1,5); g.deleteAttribute("normal"); g.deleteAttribute("uv"); g=mergeVertices(g); const p=g.attributes.position; const o=rnd()*50;
 for(let i=0;i<p.count;i++){const v=new T.Vector3().fromBufferAttribute(p,i); const k=1+0.45*fbm(v.x*1.1+o,v.y*1.1+v.z*0.9,4)+0.06*fbm(v.x*7+o,v.z*7,2); v.multiplyScalar(k); v.y*=0.7; p.setXYZ(i,v.x,v.y,v.z);} g.computeVertexNormals();
 // spherical uv
 const uv=[]; for(let i=0;i<p.count;i++){const v=new T.Vector3().fromBufferAttribute(p,i).normalize(); uv.push(0.5+Math.atan2(v.z,v.x)/(2*Math.PI),0.5+Math.asin(v.y)/Math.PI);} g.setAttribute("uv",new T.Float32BufferAttribute(uv,2));
 return new T.Mesh(g,mat);}
// ---------- items ----------
const items={
 big:()=>pipe(2.0,0.62,G.brown()),
 mid:()=>pipe(2.4,0.42,G.dark()),
 small:()=>pipe(2.0,0.3,G.honey()),
 tall:()=>pipe(3.0,0.5,G.brown()),
 short:()=>shortPiece(0.4,G.brown()),
 bend:()=>bend(0.35,G.brown(0)),
 junction:()=>junction(0.3,G.dark()),
 shard:()=>shard(0.9,0.12,G.brown(),G.body(),1.0,0.8),
 shard2:()=>shard(0.6,0.1,G.dark(),G.body(),1.3,0.6),
 shard3:()=>shard(1.1,0.13,G.honey(),G.body(),0.7,0.9),
 pebble:()=>pebble(G.body()),
};
const obj=items[what](); sc.add(obj);
obj.rotation.x=+(q.get("tx")||0); obj.rotation.z=+(q.get("tz")||0); obj.rotation.y=+(q.get("ry")||0.5);
obj.updateMatrixWorld(true);
const bb=new T.Box3().setFromObject(obj); const c=bb.getCenter(new T.Vector3()); const sz=bb.getSize(new T.Vector3()).length();
obj.position.sub(c);
const cam=new T.PerspectiveCamera(20,1,0.1,200); const el=+(q.get("el")||0.28);
cam.position.set(0,Math.sin(el)*sz*2.9,Math.cos(el)*sz*2.9); cam.lookAt(0,0,0);
r.render(sc,cam); window.done=true;
</script></body></html>
